[project]
name = "autowechat"
version = "0.1.0"
description = "Conservative local auto-reply assistant core for macOS WeChat."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
autowechat = "autowechat.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
